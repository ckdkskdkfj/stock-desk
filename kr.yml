name: KR 60일 신고가

on:
  schedule:
    - cron: "7 7 * * 1-5"      # 16:07 KST 평일 (거래소 마감 데이터 게시 뒤)
  workflow_dispatch:
  push:
    paths:
      - "pipeline/**"
      - ".github/workflows/kr.yml"
      - "requirements.txt"

permissions:
  contents: write

concurrency:
  group: kr
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: run
        id: run
        continue-on-error: true
        run: |
          mkdir -p data/logs
          python pipeline/kr.py 2>&1 | tee data/logs/kr_last.txt
          exit ${PIPESTATUS[0]}
      - name: commit
        run: |
          git config user.name "stock-desk bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git commit -m "kr $(date +%F\ %H:%M) ${{ steps.run.outcome }}" || echo "nothing to commit"
          for i in 1 2 3; do git pull --rebase && git push && break || sleep 15; done
      - name: result
        run: |
          cat data/status_kr.json
          test "${{ steps.run.outcome }}" = "success"
